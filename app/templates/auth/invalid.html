{% extends "base.html" %}
{% block title %}{{ t("auth.invalid_title") }} – {{ t("app.name") }}{% endblock %}
{% block content %}
  <section class="card" role="alert">
    <h1>{{ t("auth.invalid_title") }}</h1>
    <p>{{ t("auth.invalid_text") }}</p>
    <p><a href="{{ url_for('auth.login') }}">{{ t("auth.invalid_again") }}</a></p>
  </section>
{% endblock %}
