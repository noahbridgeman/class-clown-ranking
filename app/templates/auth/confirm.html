{% extends "base.html" %}
{% block title %}{{ t("auth.confirm_title") }} – {{ t("app.name") }}{% endblock %}
{% block content %}
  <section class="card">
    <h1>{{ t("auth.confirm_title") }}</h1>
    <p>{{ t("auth.confirm_text", days=days) }}</p>
    <form method="post" class="form">
      {{ form.csrf_token }}
      <button type="submit" class="button">{{ t("auth.confirm_button") }}</button>
    </form>
  </section>
{% endblock %}
