{% extends "base.html" %}
{% block title %}{{ t("auth.sent_title") }} – {{ t("app.name") }}{% endblock %}
{% block content %}
  <section class="card">
    <h1>{{ t("auth.sent_title") }}</h1>
    <p>{{ t("auth.sent_text", minutes=minutes) }}</p>
    <p class="muted">{{ t("auth.sent_hint") }}</p>
    <p><a href="{{ url_for('auth.login') }}">{{ t("auth.sent_again") }}</a></p>
  </section>
{% endblock %}
