[mail]
login_subject = "Dein Login-Link für das Spaßvogel-Ranking"
login_body = """Hallo,

mit diesem Link meldest du dich an:

{link}

Der Link ist {minutes} Minuten gültig und funktioniert nur einmal.
Wenn du ihn nicht angefordert hast, kannst du diese Mail einfach ignorieren.
"""

admin_granted_subject = "Du bist jetzt Admin von „{group}“"
admin_granted_body = """Hallo,

du bist jetzt Admin der Gruppe „{group}“ im Spaßvogel-Ranking. Du kannst Leute einladen, Mitglieder entfernen und die Einstellungen der Gruppe ändern.

{link}
"""
invitation_subject = "{inviter} lädt dich in „{group}“ ein"
invitation_body = """Hallo,

{inviter} lädt dich in die Gruppe „{group}“ im Spaßvogel-Ranking ein. Dort bewertet ihr euch gegenseitig und verfolgt, wer der Lustigste ist.

Mit diesem Link nimmst du die Einladung an und meldest dich gleichzeitig an:

{link}

Der Link ist {days} Tage gültig und funktioniert nur einmal.
Wenn du die Person nicht kennst, kannst du diese Mail einfach ignorieren.
"""

